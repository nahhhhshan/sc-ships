<style>
/* 収支帳（StarCitizen収支記録）と同じ配色・書体。上に絞り込み、下に一覧表。詳細と比較は重ねて開く小窓 */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f5f7f9; --ink:#16202b; --muted:#5b6878; --line:#d5dce4;
  --accent:#0e7490; --accent-soft:#d8eef3; --gold:#9a5b00; --gold-soft:#f6ead6; --pos:#15803d; --neg:#b42318;
  --shade:rgba(10,20,30,.45);
  --f-disp:"Chakra Petch","IBM Plex Sans JP",system-ui,sans-serif;
  --f-body:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0c1219; --surface:#131c26; --surface-2:#18232f; --ink:#e3e9f0; --muted:#8594a6; --line:#243140;
    --accent:#38bdd8; --accent-soft:#12303a; --gold:#e0a93b; --gold-soft:#33270f; --pos:#4ade80; --neg:#f87171;
    --shade:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c1219; --surface:#131c26; --surface-2:#18232f; --ink:#e3e9f0; --muted:#8594a6; --line:#243140;
  --accent:#38bdd8; --accent-soft:#12303a; --gold:#e0a93b; --gold-soft:#33270f; --pos:#4ade80; --neg:#f87171;
  --shade:rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;padding-inline:16px;padding-block:20px 96px;margin:0}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:16px}
.wrap>*{min-width:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:6px 16px}
.brand{font-family:var(--f-disp);font-weight:600;font-size:26px;letter-spacing:.04em;margin:0;line-height:1.1}
.brand span{color:var(--accent)}
.lead{margin:4px 0 0;font-size:13px;color:var(--muted);max-width:60ch}
.sub{color:var(--muted);font-size:12px;letter-spacing:.04em;display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:4px}
.sub .ver{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 5px}
#storeNote{font-size:12px;color:var(--muted);text-align:right}
#storeNote b{color:var(--ink);font-weight:500}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.panel h2{font-family:var(--f-disp);font-size:16px;margin:0 0 6px;letter-spacing:.03em}
.hint{color:var(--muted);font-size:12.5px;margin:4px 0 0}

.filters{display:grid;gap:12px}
.filters>summary{cursor:pointer;font-family:var(--f-disp);font-size:14px;letter-spacing:.04em;color:var(--accent);list-style:none}
.filters>summary::before{content:"▸ "}
.filters[open]>summary::before{content:"▾ "}
.filters>summary .muted{font-family:var(--f-body);font-size:12px;margin-left:8px;letter-spacing:0}
.filters[open]>summary{margin-bottom:-2px}
.frow{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end}
.f{display:grid;gap:3px;min-width:0}
.lab{font-size:11px;color:var(--muted);letter-spacing:.08em}
input[type=search],input[type=number],input[type=text],select{background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:6px 8px;min-height:34px;max-width:100%}
input[type=search]{width:min(320px,100%)}
select{max-width:min(260px,100%)}
input[type=number]{width:120px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{background:var(--surface-2);border:0;padding:6px 11px;min-height:34px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--surface);font-weight:500}
.chk{display:inline-flex;gap:6px;align-items:center;min-height:34px;cursor:pointer;font-size:13px}
.btn{background:var(--accent);color:var(--surface);border:0;border-radius:4px;padding:7px 14px;min-height:34px;cursor:pointer;font-weight:500}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.small{padding:3px 10px;min-height:28px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}

.summary{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;font-size:13px;color:var(--muted)}
.summary b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.fleet{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;font-size:13px;border-left:3px solid var(--gold);padding:4px 0 4px 10px;color:var(--muted)}
.fleet b{color:var(--ink);font-family:var(--f-mono);font-weight:500}

.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 5px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line);vertical-align:middle}
/* 役割は折り返して、表が枠の幅に収まるようにする */
td.wrap{white-space:normal;min-width:9em}
/* 船名は1行のまま。下の行のメーカー名とバリエーション名だけ折り返す */
td.name{white-space:normal;min-width:12em}
td.name .nm{white-space:nowrap}
td.name .nm small{display:block;white-space:normal;margin-left:0}
th{position:sticky;top:0;background:var(--surface-2);font-weight:500;font-size:11.5px;color:var(--muted);letter-spacing:.04em;user-select:none}
#thead th{white-space:normal;vertical-align:bottom;line-height:1.3}   /* 見出しは2行に折り返して列を細くする（値の列は折り返さない） */
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--ink)}
th[data-dir=asc]::after{content:" ▲";color:var(--accent)}
th[data-dir=desc]::after{content:" ▼";color:var(--accent)}
td.r,th.r{text-align:right}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.thumb{width:64px;height:36px;object-fit:cover;border-radius:3px;background:var(--surface-2);display:block}
.thumb.none{display:grid;place-items:center;font-size:10px;color:var(--muted)}
.nm{font-weight:600}
.nm small{font-weight:400;color:var(--muted);margin-left:6px;font-size:11px}
.mf{font-size:11.5px;color:var(--muted)}
.role{font-size:12.5px}
.role small{display:block;color:var(--muted);font-size:11px}
.sz{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:3px;padding:0 5px}
.pill{display:inline-block;font-size:11px;border-radius:999px;padding:0 7px;margin-right:3px;line-height:18px}
.pill.own{background:var(--gold-soft);color:var(--gold)}
.pill.want{background:var(--accent-soft);color:var(--accent)}
.pill.gv{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
td.cmp{width:34px}
td.cmp input{width:17px;height:17px;cursor:pointer}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* 船名を1行のまま収めるため、画面が狭くなるほど列を減らす（l → m → s の順に隠す） */
@media (max-width:1230px){ .hide-l{display:none} }
@media (max-width:1080px){ .hide-m{display:none} }
@media (max-width:850px){ .hide-s{display:none} .thumb{width:56px;height:32px} }

/* 比較バー（下に固定） */
.cmpbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.cmpbar .in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cmpbar .chip{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 10px;font-size:12.5px;display:inline-flex;align-items:center;gap:4px}
.cmpbar .chip button{background:none;border:0;cursor:pointer;color:var(--muted);padding:0 5px;font-size:15px;line-height:1}
.cmpbar .grow{flex:1}

/* 小窓 */
dialog{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:0;width:min(920px,calc(100vw - 24px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:var(--shade)}
.dhead{display:flex;gap:12px;align-items:start;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dhead h2{font-family:var(--f-disp);font-size:22px;margin:0;line-height:1.15;text-wrap:balance}
.dhead .x{background:none;border:1px solid var(--line);border-radius:4px;width:34px;height:34px;cursor:pointer;font-size:18px;flex:none}
.dbody{padding:14px 16px 18px;display:grid;gap:16px}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.hero img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:5px;background:var(--surface-2);max-width:100%}
@media (max-width:640px){ .hero{grid-template-columns:1fr} }
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.tag{font-size:12px;border:1px solid var(--line);border-radius:3px;padding:1px 7px;background:var(--surface-2)}
.price{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;align-items:baseline}
.price .v{font-family:var(--f-mono);font-size:15px}
.price .v.big{font-size:19px;color:var(--gold)}
.secs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.sec h3{font-family:var(--f-disp);font-size:13.5px;letter-spacing:.06em;color:var(--accent);margin:0 0 6px;padding-bottom:3px;border-bottom:1px solid var(--line)}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:13px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.mini{width:100%;font-size:12.5px}
.mini td,.mini th{padding:4px 6px;white-space:normal}
.mini th{position:static}
.desc{font-size:13px;color:var(--muted);max-width:70ch;margin:0}
.links{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px}
.mine{display:grid;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.mine .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mine ul{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.mine li{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px}
.mine li input{flex:1;min-width:140px}
.cmpt{width:100%}
.cmpt th{position:static;white-space:normal;vertical-align:bottom;text-align:right}
.cmpt th:first-child,.cmpt td:first-child{text-align:left;color:var(--muted)}
.cmpt td{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.cmpt td.best{color:var(--pos);font-weight:600}
.cmpt tr.grp td{font-family:var(--f-disp);color:var(--accent);text-align:left;background:var(--surface-2);font-size:12px;letter-spacing:.06em}
.cmpt img{width:120px;max-width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:3px;display:block;margin-left:auto;margin-bottom:4px}
footer{font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 16px}
@media (prefers-reduced-motion: no-preference){ tbody tr{transition:background .12s} }
.hright{display:grid;gap:6px;justify-items:end}
.lang button{padding:3px 10px!important;min-height:28px!important;font-size:12.5px}
.sortrow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.schip{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);font-size:12.5px;overflow:hidden}
.schip .no{font-family:var(--f-mono);font-size:11px;color:var(--surface);background:var(--accent);padding:0 7px;display:grid;place-items:center}
.schip button{background:none;border:0;cursor:pointer;padding:3px 9px;min-height:28px}
.schip .dir{color:var(--accent);font-weight:600;margin-left:2px}
.schip .rm{color:var(--muted);border-left:1px solid var(--line);padding:3px 8px}
@media (max-width:560px){ .hright{justify-items:start} }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1 class="brand">SC <span data-i18n="brand">船一覧</span></h1>
      <p class="lead" data-i18n="lead">Star Citizen の船と地上車両の性能・価格・購入場所を、絞り込み・並べ替え・比較できる一覧です。</p>
      <div class="sub"><span id="gameVer"></span><span id="fetched"></span><span class="ver" id="appVer"></span></div>
    </div>
    <div class="hright">
      <div class="seg lang" id="langSeg" role="group" aria-label="Language / 言語">
        <button type="button" data-v="ja" aria-pressed="true">日本語</button>
        <button type="button" data-v="en" aria-pressed="false">English</button>
      </div>
      <div id="storeNote"></div>
    </div>
  </header>

  <section class="panel filters" data-i18n-aria="filtersAria">
    <div class="frow">
      <label class="f"><span class="lab" data-i18n="search">検索</span><input type="search" id="q" data-i18n-ph="searchPh"></label>
      <div class="f"><span class="lab" data-i18n="type">種別</span>
        <div class="seg" id="typeSeg" role="group">
          <button type="button" data-v="ship" aria-pressed="true" data-i18n="tShip">船</button>
          <button type="button" data-v="gv" aria-pressed="false" data-i18n="tGv">地上車両</button>
          <button type="button" data-v="all" aria-pressed="false" data-i18n="all">すべて</button>
        </div>
      </div>
      <div class="f"><span class="lab" data-i18n="size">サイズ</span>
        <div class="seg" id="sizeSeg" role="group"></div>
      </div>
    </div>
    <details class="filters" id="more" open>
      <summary><span data-i18n="more">詳しい条件</span><span class="muted" id="moreNote"></span></summary>
    <div class="frow">
      <label class="f"><span class="lab" data-i18n="mfr">メーカー</span><select id="mfr"></select></label>
      <label class="f"><span class="lab" data-i18n="career">分類</span><select id="car"></select></label>
      <label class="f"><span class="lab" data-i18n="role">役割</span><select id="role"></select></label>
      <label class="f"><span class="lab" data-i18n="cminMax">最小乗員 ○人以下</span><input type="number" id="cminMax" min="1" step="1" inputmode="numeric" data-i18n-ph="noLimit"></label>
      <label class="f"><span class="lab" data-i18n="cmaxMin">最大乗員 ○人以上</span><input type="number" id="cmaxMin" min="1" step="1" inputmode="numeric" data-i18n-ph="noLimit"></label>
      <label class="f"><span class="lab" data-i18n="scuMin">積載 SCU 以上</span><input type="number" id="scuMin" min="0" step="1" inputmode="numeric" placeholder="0"></label>
      <label class="f"><span class="lab" data-i18n="priceMax">価格 aUEC 以下</span><input type="number" id="priceMax" min="0" step="100000" inputmode="numeric" data-i18n-ph="noLimit"></label>
    </div>
    <div class="frow">
      <label class="chk"><input type="checkbox" id="buyable"> <span data-i18n="buyable">ゲーム内で買える</span></label>
      <label class="chk"><input type="checkbox" id="rentable"> <span data-i18n="rentable">レンタルできる</span></label>
      <label class="f"><span class="lab" data-i18n="owned">所持</span><select id="mark"></select></label>
      <button class="btn ghost" type="button" id="resetBtn" data-i18n="reset">条件をリセット</button>
    </div>
    </details>
    <div class="f">
      <span class="lab" data-i18n="sortBy">並べ替え</span>
      <div class="sortrow">
        <span id="sortChips" style="display:contents"></span>
        <select id="sortAdd" data-i18n-aria="sortAdd"></select>
        <span class="hint" data-i18n="sortHint">番号の小さい条件から順に並べます。見出しのクリックで並べ替え、Shift＋クリックで条件を追加。</span>
      </div>
    </div>
  </section>

  <section class="panel" id="webPanel" hidden></section>

  <div class="summary" id="summary"></div>
  <div class="fleet" id="fleet" hidden></div>

  <div class="tablebox">
    <table>
      <thead><tr id="thead"></tr></thead>
      <tbody id="tbody"><tr><td class="empty" colspan="14" data-i18n="loading">船のデータを読み込んでいます…</td></tr></tbody>
    </table>
  </div>

  <footer>
    <span data-i18n="credit">データ: Star Citizen Wiki API（api.star-citizen.wiki）。ゲーム内価格と購入場所は UEX Corp の値を Wiki API 経由で取得。画像: starcitizen.tools</span>
    <span id="updated"></span>
  </footer>
</div>

<div class="cmpbar" id="cmpbar" hidden>
  <div class="in">
    <span class="lab" data-i18n="compare">比較</span>
    <span id="cmpChips" style="display:contents"></span>
    <span class="grow"></span>
    <button class="btn ghost small" type="button" id="cmpClear" data-i18n="cmpClear">選択を解除</button>
    <button class="btn" type="button" id="cmpOpen"></button>
  </div>
</div>

<dialog id="detail" aria-labelledby="dTitle"></dialog>
<dialog id="compare" aria-labelledby="cTitle"></dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js?v=1.2.0"></script>
<script src="web_backend.js?v=1.2.0"></script>
<script>
/* 'artifact'（claude.ai の Artifact。所持の印はこのブラウザに保存）／'web'（GitHub Pages。所持の印は Firebase で共有）。make_web.py が書き換える */
const MODE = 'web';
const APP_VERSION = '1.2.0';
const APP_UPDATED = '2026-10-03 02:42';
const CMP_MAX = 4;
const SORT_MAX = 4;
const PAGES_URL = 'https://nahhhhshan.github.io/sc-ships/';   // 所持リストを共有できる GitHub Pages 版

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function lsGet(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }

/* ---------- 言語 ----------

const tr = (map, k) => k == null ? '' : map[k] ? (Array.isArray(map[k]) ? L(...map[k]) : L(map[k], k)) : k;

let SHIPS = [], BY_ID = {}, DATA = {};
const roleTokens = s => (s.role || '').split('/').map(t => t.trim()).filter(Boolean);
const roleText = s => roleTokens(s).map(t => tr(ROLE, t)).join(' / ');
const szOf = s => s.sz ? Math.min(s.sz, 6) : null;
const priceOf = s => s.buy && s.buy.length ? s.buy[0][0] : null;
const rentOf = s => s.rent && s.rent.length ? s.rent[0][0] : null;
// 乗員は最小（動かすのに要る人数）と最大（乗れる乗員の数）を別々に扱う。片方しかない船は、ない方を空欄（—）にする
const crewMin = s => (s.crew || [])[0] ?? null;
const crewMax = s => (s.crew || [])[1] ?? null;
const showVar = s => s.var && s.var.replace(/\s+/g, '').toLowerCase() !== s.n.replace(/[\s-]+/g, '').toLowerCase();
const imgSrc = s => s.img ? 'img/' + s.id + '.webp' : '';
const me = () => store.me || L('自分', 'Me');

/* ---------- 所持・欲しいの保存先 ----------
 * 項目は {id, ship, kind:'own'|'want', by, memo}。web_backend.js（Pages 版）が共有リストに接続すると、add/remove/setMemo を差し替える。 */
const LOCAL_KEY = 'scships-local-v1';
const store = {
  items: [], me: lsGet('scships-name') || lsGet('auec-web-name') || '', shared: false,
  loadLocal(){ try{ this.items = JSON.parse(lsGet(LOCAL_KEY) || '[]'); }catch(e){ this.items = []; } },
  saveLocal(){ lsSet(LOCAL_KEY, JSON.stringify(this.items)); },
  async add(ship, kind){ this.items.push({id: 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ship, kind, by: this.me, memo: ''}); this.saveLocal(); render(); },
  async remove(id){ this.items = this.items.filter(i => i.id !== id); this.saveLocal(); render(); },
  async setMemo(id, memo){ const i = this.items.find(i => i.id === id); if(i){ i.memo = memo; this.saveLocal(); } },
};
const itemsOf = ship => store.items.filter(i => i.ship === ship);
let storeNoteHTML = () => L('所持リストの保存先: <b>このブラウザ</b>', 'Owned list: <b>this browser</b>')
  + (MODE !== 'web' ? `<br>${L('共有するなら', 'To share it, use the')} <a href="${PAGES_URL}" target="_blank" rel="noopener">${L('Web版', 'web version')}</a>` : '');

/* ---------- 絞り込みと並べ替えの状態 ---------- */
const DEFAULT = {q:'', type:'ship', size:'', mfr:'', car:'', role:'', cminMax:'', cmaxMin:'', scuMin:'', priceMax:'', buyable:false, rentable:false, mark:''};
const st = Object.assign({}, DEFAULT);
let sorts = [{k:'n', dir:1}];   // 先頭から順に適用する並べ替えの条件
const cmp = [];

const COLS = [
  {k:'cmp', label:() => L('比較', 'Cmp'), cls:'cmp'},
  {k:'img', label:() => '', cls:'hide-s'},
  {k:'n', label:() => L('船名', 'Name'), get:s => s.n.toLowerCase(), sortable:true, cls:'name'},
  {k:'m', label:() => L('メーカー', 'Maker'), get:s => s.m, sortable:true, hidden:true},

  {k:'cmax', label:() => L('最大乗員', 'Max crew'), get:crewMax, sortable:true, r:true, cls:'hide-m'},
  {k:'scu', label:() => L('積載 SCU', 'Cargo SCU'), get:s => s.scu || 0, sortable:true, r:true},
  {k:'scm', label:() => 'SCM m/s', get:s => s.scm, sortable:true, r:true, cls:'hide-m'},
  {k:'vmax', label:() => L('最高速度', 'Max speed'), get:s => s.vmax, sortable:true, r:true, hidden:true},
  {k:'shp', label:() => L('シールド', 'Shield'), get:s => s.shp, sortable:true, r:true, cls:'hide-m'},
  {k:'hp', label:() => L('機体HP', 'Hull HP'), get:s => s.hp, sortable:true, r:true, cls:'hide-l'},
  {k:'dps', label:() => 'DPS', get:s => (s.dps || 0) + (s.tdps || 0) || null, sortable:true, r:true, cls:'hide-l'},
  {k:'qr', label:() => L('量子航続', 'QT range'), get:s => s.qr, sortable:true, r:true, hidden:true},

  {k:'rent', label:() => L('レンタル aUEC', 'Rent aUEC'), get:rentOf, sortable:true, r:true, hidden:true},
  {k:'msrp', label:() => 'MSRP $', get:s => s.msrp, sortable:true, r:true, cls:'hide-s'},
  {k:'mark', label:() => L('所持', 'Owned'), get:s => itemsOf(s.id).filter(i => i.kind === 'own').length, sortable:true, cls:'hide-s'},
];
const COL = Object.fromEntries(COLS.map(c => [c.k, c]));
const defaultDir = k => ['n', 'm', 'role', 'price', 'rent', 'msrp', 'sz', 'cmin'].includes(k) ? 1 : -1;   // 数値の項目は大きい順から

function matches(s){
  if(st.type === 'ship' && s.gv) return false;
  if(st.type === 'gv' && !s.gv) return false;
  if(st.size && String(szOf(s)) !== st.size) return false;
  if(st.mfr && s.m !== st.mfr) return false;
  if(st.car && s.car !== st.car) return false;
  if(st.role && !roleTokens(s).includes(st.role)) return false;
  if(st.cminMax !== '' && !(crewMin(s) != null && crewMin(s) <= +st.cminMax)) return false;
  if(st.cmaxMin !== '' && !(crewMax(s) != null && crewMax(s) >= +st.cmaxMin)) return false;
  if(st.scuMin !== '' && (s.scu || 0) < +st.scuMin) return false;
  if(st.priceMax !== '' && !(priceOf(s) != null && priceOf(s) <= +st.priceMax)) return false;
  if(st.buyable && priceOf(s) == null) return false;
  if(st.rentable && rentOf(s) == null) return false;
  if(st.mark){
    const its = itemsOf(s.id);
    if(st.mark === 'own' && !its.some(i => i.kind === 'own')) return false;
    if(st.mark === 'mine' && !its.some(i => i.kind === 'own' && i.by === store.me)) return false;
    if(st.mark === 'want' && !its.some(i => i.kind === 'want')) return false;
    if(st.mark === 'none' && its.some(i => i.kind === 'own')) return false;
  }
  if(st.q){
    // 検索は言語に関係なく日本語・英語どちらの役割名でも当たるようにする
    const hay = [s.n, s.var, s.m, s.mc, s.role, roleTokens(s).map(t => ROLE[t]).join(' '), s.car, CAREER[s.car]].join(' ').toLowerCase();
    if(!st.q.toLowerCase().split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}

function sorted(list){
  const keys = sorts.map(o => ({get: COL[o.k].get, dir: o.dir}));
  return list.slice().sort((a, b) => {
    for(const {get, dir} of keys){
      const x = get(a), y = get(b);
      const xe = x == null || x === '', ye = y == null || y === '';
      if(xe && ye) continue;
      if(xe || ye) return xe ? 1 : -1;   // 値のない船はどちらの向きでも末尾
      const d = typeof x === 'string' ? x.localeCompare(y, LANG) : x - y;
      if(d) return d * dir;
    }
    return a.n.localeCompare(b.n);
  });
}

// 見出しのクリック: その項目だけで並べ替え（すでに1番目なら向きを反転）。Shift+クリック: 条件に追加（すでにあれば向きを反転）
function headerSort(k, add){
  const i = sorts.findIndex(o => o.k === k);
  if(add){
    if(i >= 0) sorts[i].dir *= -1;
    else if(sorts.length < SORT_MAX) sorts.push({k, dir: defaultDir(k)});
    else flash(L(`並べ替えの条件は ${SORT_MAX} つまでです`, `Up to ${SORT_MAX} sort keys`));
  }else{
    sorts = i === 0 && sorts.length === 1 ? [{k, dir: -sorts[0].dir}] : [{k, dir: i === 0 ? -sorts[0].dir : defaultDir(k)}];
  }
  render();
}

function renderSortUI(){
  $('sortChips').innerHTML = sorts.map((o, i) => `<span class="schip"><span class="no">${i + 1}</span>
    <button type="button" data-sdir="${i}" title="${L('向きを反転', 'Reverse')}">${esc(COL[o.k].label())} <span class="dir">${o.dir > 0 ? L('▲ 昇順', '▲ asc') : L('▼ 降順', '▼ desc')}</span></button>
    ${sorts.length > 1 ? `<button type="button" class="rm" data-srm="${i}" aria-label="${L('この条件を外す', 'Remove this key')}">×</button>` : ''}</span>`).join('');
  const left = COLS.filter(c => c.sortable && !sorts.some(o => o.k === c.k));
  $('sortAdd').hidden = sorts.length >= SORT_MAX;
  $('sortAdd').innerHTML = `<option value="">${L('＋ 条件を追加', '+ Add key')}</option>` + left.map(c => `<option value="${c.k}">${esc(c.label())}</option>`).join('');
}

function markPills(s){
  const its = itemsOf(s.id);
  const own = its.filter(i => i.kind === 'own'), want = its.filter(i => i.kind === 'want');
  const who = arr => esc([...new Set(arr.map(i => i.by || me()))].join(', '));
  return (own.length ? `<span class="pill own" title="${who(own)}">${L('所持', 'Owned')} ${own.length}</span>` : '')
       + (want.length ? `<span class="pill want" title="${who(want)}">${L('欲しい', 'Wanted')}</span>` : '');
}

function cell(c, s){
  const cls = (c.r ? 'r ' : '') + (c.cls || '');
  let h;
  switch(c.k){
    case 'cmp': h = `<input type="checkbox" data-cmp="${esc(s.id)}" ${cmp.includes(s.id) ? 'checked' : ''} aria-label="${esc(s.n)} ${L('を比較に追加', '— add to comparison')}">`; break;
    case 'img': h = s.img ? `<img class="thumb" loading="lazy" alt="" src="${esc(imgSrc(s))}" onerror="this.style.visibility='hidden'">` : `<span class="thumb none">${L('画像なし', 'No image')}</span>`; break;
    case 'n': h = `<div class="nm">${esc(s.n)}${showVar(s) ? `<small>${esc(s.var)}</small>` : ''}</div><div class="mf">${esc(s.m)}${s.gv ? ` <span class="pill gv">${L('地上車両', 'Ground')}</span>` : ''}</div>`; break;
    case 'role': h = `<div class="role">${esc(roleText(s)) || '—'}<small>${esc(tr(CAREER, s.car))}</small></div>`; break;
    case 'sz': h = szOf(s) ? `<span class="sz" title="${sizeName(szOf(s))}">S${szOf(s)}</span>` : '—'; break;
    case 'msrp': h = `<span class="num">${s.msrp ? '$' + fmt(s.msrp) : '—'}</span>`; break;
    case 'mark': h = markPills(s); break;
    default: h = `<span class="num">${fmt(c.get(s))}</span>`;
  }
  return `<td class="${cls}">${h}</td>`;
}

function render(){
  if(!SHIPS.length) return;
  const shown = COLS.filter(c => !c.hidden);
  $('thead').innerHTML = shown.map(c => {
    const i = sorts.findIndex(o => o.k === c.k);
    const aria = i === 0 ? `aria-sort="${sorts[0].dir > 0 ? 'ascending' : 'descending'}"` : '';
    const dir = i >= 0 ? `data-dir="${sorts[i].dir > 0 ? 'asc' : 'desc'}"` : '';
    return `<th class="${(c.r ? 'r ' : '') + (c.cls || '') + (c.sortable ? ' sortable' : '')}" ${c.sortable ? `data-sort="${c.k}"` : ''} ${aria} ${dir} scope="col">${c.label()}</th>`;
  }).join('');
  const list = sorted(SHIPS.filter(matches));
  $('tbody').innerHTML = list.length
    ? list.map(s => `<tr data-id="${esc(s.id)}">${shown.map(c => cell(c, s)).join('')}</tr>`).join('')
    : `<tr><td class="empty" colspan="${shown.length}">${L('条件に合う船はありません。条件をゆるめるか「条件をリセット」を押してください。', 'No ships match. Loosen the filters or press “Reset filters”.')}</td></tr>`;
  const scu = list.reduce((t, s) => t + (s.scu || 0), 0);
  const buyable = list.filter(s => priceOf(s) != null).length;
  $('summary').innerHTML = L(
    `<span><b>${list.length}</b> / ${SHIPS.length} 隻</span><span>ゲーム内で買える <b>${buyable}</b> 隻</span><span>表示中の積載合計 <b>${fmt(scu)}</b> SCU</span>`,
    `<span><b>${list.length}</b> / ${SHIPS.length} ships</span><span><b>${buyable}</b> buyable in game</span><span>Total cargo shown <b>${fmt(scu)}</b> SCU</span>`);
  renderFleet();
  renderCmpBar();
  renderSortUI();
  const on = ['mfr', 'car', 'role', 'cminMax', 'cmaxMin', 'scuMin', 'priceMax', 'buyable', 'rentable', 'mark'].filter(k => st[k]).length;
  $('moreNote').textContent = on ? L(`${on} 件の条件で絞り込み中`, `${on} filter${on > 1 ? 's' : ''} active`) : '';
}

function renderFleet(){
  const own = store.items.filter(i => i.kind === 'own' && BY_ID[i.ship]);
  const want = store.items.filter(i => i.kind === 'want' && BY_ID[i.ship]);
  const box = $('fleet');
  box.hidden = !own.length && !want.length;
  if(box.hidden) return;
  const scu = own.reduce((t, i) => t + (BY_ID[i.ship].scu || 0), 0);
  const value = own.reduce((t, i) => t + (priceOf(BY_ID[i.ship]) || 0), 0);
  const people = {};
  own.forEach(i => { const k = i.by || me(); people[k] = (people[k] || 0) + 1; });
  box.innerHTML = `<span>${store.shared ? L('共有リスト', 'Shared list') : L('所持リスト', 'Owned list')}</span>`
    + `<span>${L('所持', 'Owned')} <b>${own.length}</b>${L(' 隻', '')}</span><span>${L('積載合計', 'Total cargo')} <b>${fmt(scu)}</b> SCU</span>`
    + (value ? `<span>${L('ゲーム内価格の合計', 'In-game value')} <b>${fmt(value)}</b> aUEC</span>` : '')
    + `<span>${L('欲しい', 'Wanted')} <b>${want.length}</b>${L(' 隻', '')}</span>`
    + (Object.keys(people).length > 1 || store.shared ? Object.entries(people).map(([k, n]) => `<span>${esc(k)} <b>${n}</b></span>`).join('') : '');
}

/* ---------- 比較 ---------- */
function toggleCmp(id, on){
  const i = cmp.indexOf(id);
  if(on && i < 0){ if(cmp.length >= CMP_MAX){ render(); flash(L(`比較できるのは ${CMP_MAX} 隻までです`, `You can compare up to ${CMP_MAX} ships`)); return; } cmp.push(id); }
  if(!on && i >= 0) cmp.splice(i, 1);
  render();
}
function renderCmpBar(){
  $('cmpbar').hidden = !cmp.length;
  $('cmpChips').innerHTML = cmp.map(id => `<span class="chip">${esc(BY_ID[id].n)}<button type="button" data-uncmp="${esc(id)}" aria-label="${esc(BY_ID[id].n)} ${L('を外す', '— remove')}">×</button></span>`).join('');
  $('cmpOpen').disabled = cmp.length < 2;
  $('cmpOpen').textContent = cmp.length < 2 ? L('もう1隻選ぶと比べられます', 'Pick one more ship to compare') : L(`${cmp.length} 隻を並べて比べる`, `Compare ${cmp.length} ships`);
}
let flashTimer, flashing = false;
function setNote(html){ storeNoteHTML = typeof html === 'function' ? html : () => html; if(!flashing) $('storeNote').innerHTML = storeNoteHTML(); }
function flash(msg){
  flashing = true;
  $('storeNote').innerHTML = `<b>${esc(msg)}</b>`;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { flashing = false; $('storeNote').innerHTML = storeNoteHTML(); }, 2600);
}

// [見出し（日本語, 英語）, 値の取り出し, 表示, 良い向き（1:大きいほど良い / -1:小さいほど良い / 0:比べない）]。取り出しのない行は区切り
const METRICS = [
  [['基本', 'Basics']],
  [['メーカー', 'Manufacturer'], s => s.m, v => esc(v), 0],
  [['役割', 'Role'], s => roleText(s), v => esc(v), 0],
  [['サイズ', 'Size'], szOf, v => v ? `S${v} ${sizeName(v)}` : '—', 0],
  [['最小乗員', 'Min crew'], crewMin, v => fmt(v), 0],
  [['最大乗員', 'Max crew'], crewMax, v => fmt(v), 0],
  [['全長 m', 'Length m'], s => (s.dim || [])[0], v => fmt(v, 1), 0],
  [['質量 kg', 'Mass kg'], s => s.mass, v => fmt(v), 0],
  [['積載', 'Cargo']],
  [['貨物 SCU', 'Cargo SCU'], s => s.scu || 0, v => fmt(v), 1],
  [['鉱石 SCU', 'Ore SCU'], s => s.ore, v => fmt(v), 1],
  [['個人保管 SCU', 'Personal storage SCU'], s => s.inv, v => fmt(v, 2), 1],
  [['ベッド', 'Beds'], s => s.beds, v => fmt(v), 1],
  [['飛行', 'Flight']],
  [['SCM m/s', 'SCM m/s'], s => s.scm, v => fmt(v), 1],
  [['最高速度 m/s', 'Max speed m/s'], s => s.vmax, v => fmt(v), 1],
  [['ブースト m/s', 'Boost m/s'], s => s.boost, v => fmt(v), 1],
  [['ピッチ °/s', 'Pitch °/s'], s => (s.ag || [])[0], v => fmt(v), 1],
  [['ヨー °/s', 'Yaw °/s'], s => (s.ag || [])[1], v => fmt(v), 1],
  [['ロール °/s', 'Roll °/s'], s => (s.ag || [])[2], v => fmt(v), 1],
  [['量子速度 km/s', 'QT speed km/s'], s => s.qs, v => fmt(v), 1],
  [['量子航続 Gm', 'QT range Gm'], s => s.qr, v => fmt(v, 1), 1],
  [['防御・武装', 'Defense & weapons']],
  [['機体HP', 'Hull HP'], s => s.hp, v => fmt(v), 1],
  [['シールド HP', 'Shield HP'], s => s.shp, v => fmt(v), 1],
  [['操縦席 DPS', 'Pilot DPS'], s => s.dps, v => fmt(v), 1],
  [['砲塔 DPS', 'Turret DPS'], s => s.tdps, v => fmt(v), 1],
  [['ミサイル 発', 'Missiles'], s => s.mis, v => fmt(v), 1],
  [['価格', 'Price']],
  [['ゲーム内価格 aUEC', 'In-game price aUEC'], priceOf, v => fmt(v), -1],
  [['レンタル 1日 aUEC', 'Rent per day aUEC'], rentOf, v => fmt(v), -1],
  [['MSRP $', 'MSRP $'], s => s.msrp, v => v ? '$' + fmt(v) : '—', -1],
  [['保険の請求 分', 'Claim time min'], s => (s.ins || [])[0], v => fmt(v, 1), -1],
];
function openCompare(){
  const ships = cmp.map(id => BY_ID[id]);
  let rows = '';
  for(const [label, get, show, better] of METRICS){
    if(!get){ rows += `<tr class="grp"><td colspan="${ships.length + 1}">${L(...label)}</td></tr>`; continue; }
    const vals = ships.map(get);
    if(vals.every(v => v == null || v === '')) continue;   // どの船にも値がない項目は出さない
    const nums = vals.filter(v => typeof v === 'number' && v > 0);
    const best = better && nums.length > 1 && new Set(nums).size > 1 ? (better > 0 ? Math.max(...nums) : Math.min(...nums)) : null;
    rows += `<tr><td>${L(...label)}</td>${vals.map(v => `<td class="${best != null && v === best ? 'best' : ''}">${v == null || v === '' ? '—' : show(v)}</td>`).join('')}</tr>`;
  }
  const d = $('compare');
  d.innerHTML = `<div class="dhead"><div><h2 id="cTitle">${L(`${ships.length} 隻の比較`, `Comparing ${ships.length} ships`)}</h2><div class="hint">${L('緑の数字がその項目でいちばん良い値です（価格と保険の時間は小さいほど良い）。', 'Green marks the best value in each row (lower is better for prices and claim time).')}</div></div><button class="x" type="button" data-close aria-label="${L('閉じる', 'Close')}">×</button></div>
    <div class="dbody"><div class="tablebox"><table class="cmpt"><thead><tr><th></th>${ships.map(s => `<th>${s.img ? `<img alt="" src="${esc(imgSrc(s))}" onerror="this.remove()">` : ''}<a href="#" data-open="${esc(s.id)}">${esc(s.n)}</a>${showVar(s) ? `<div class="muted">${esc(s.var)}</div>` : ''}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
  if(!d.open) d.showModal();
}

/* ---------- 詳細 ---------- */
const kv = pairs => `<dl class="kv">${pairs.filter(p => p[1] != null && p[1] !== '' && p[1] !== '—').map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
const shopTable = rows => `<table class="mini"><thead><tr><th>${L('店', 'Shop')}</th><th>${L('場所', 'Location')}</th><th class="r">aUEC</th></tr></thead><tbody>${rows.map(r => `<tr><td>${esc(r[1])}</td><td>${esc(r[2])}${r[3] ? `<span class="muted">${L(`（${esc(r[3])}）`, ` (${esc(r[3])})`)}</span>` : ''}</td><td class="r num">${fmt(r[0])}</td></tr>`).join('')}</tbody></table>`;

function openDetail(id){
  const s = BY_ID[id]; if(!s) return;
  const d = $('detail');
  const sz = szOf(s);
  const min = L(' 分', ' min');
  const sections = [];
  sections.push([L('基本', 'Basics'), kv([
    [L('寸法（長×幅×高）', 'Size (L × W × H)'), s.dim ? s.dim.map(v => fmt(v, 1)).join(' × ') + ' m' : null],
    [L('質量', 'Mass'), s.mass ? fmt(s.mass) + ' kg' : null],
    [L('最小乗員', 'Min crew'), crewMin(s) != null ? fmt(crewMin(s)) + L(' 人', '') : '—'],
    [L('最大乗員', 'Max crew'), crewMax(s) != null ? fmt(crewMax(s)) + L(' 人', '') : '—'],
    [L('ベッド', 'Beds'), s.beds ? fmt(s.beds) : null],
    [L('医療ベッド', 'Medical bed'), s.med || null],
    [L('追加されたバージョン', 'Added in'), s.added ? esc(s.added) : null],
  ])]);
  sections.push([L('積載', 'Cargo'), kv([
    [L('貨物', 'Cargo'), fmt(s.scu || 0) + ' SCU'],
    [L('鉱石', 'Ore'), s.ore ? fmt(s.ore) + ' SCU' : null],
    [L('個人保管', 'Personal storage'), s.inv ? fmt(s.inv, 2) + ' SCU' : null],
  ])]);
  if(s.scm || s.qs) sections.push([L('飛行', 'Flight'), kv([
    [L('SCM 速度', 'SCM speed'), s.scm ? fmt(s.scm) + ' m/s' : null],
    [L('最高速度', 'Max speed'), s.vmax ? fmt(s.vmax) + ' m/s' : null],
    [L('ブースト（前進）', 'Boost (forward)'), s.boost ? fmt(s.boost) + ' m/s' : null],
    [L('ピッチ / ヨー / ロール', 'Pitch / yaw / roll'), s.ag ? s.ag.map(v => fmt(v)).join(' / ') + ' °/s' : null],
    [L('量子速度', 'QT speed'), s.qs ? fmt(s.qs) + ' km/s' : null],
    [L('量子航続距離', 'QT range'), s.qr ? fmt(s.qr, 1) + ' Gm' : null],
    [L('量子燃料', 'Quantum fuel'), s.qf ? fmt(s.qf, 1) + ' SCU' : null],
    [L('水素燃料', 'Hydrogen fuel'), s.hf ? fmt(s.hf, 1) + ' SCU' : null],
  ])]);
  sections.push([L('防御', 'Defense'), kv([
    [L('機体HP', 'Hull HP'), s.hp ? fmt(s.hp) : null],
    [L('シールド HP', 'Shield HP'), s.shp ? fmt(s.shp) : null],
    [L('シールド方式', 'Shield type'), s.sft ? esc(tr(SHIELD, s.sft)) : null],
    [L('保険の請求', 'Claim time'), s.ins && s.ins[0] ? fmt(s.ins[0], 1) + min : null],
    [L('早期請求', 'Expedite'), s.ins && s.ins[1] ? `${fmt(s.ins[1], 1)}${min} / ${fmt(s.ins[2])} aUEC` : null],
  ])]);
  const arm = [];
  arm.push(kv([
    [L('操縦席 DPS', 'Pilot DPS'), s.dps ? fmt(s.dps) : null],
    [L('砲塔 DPS', 'Turret DPS'), s.tdps ? fmt(s.tdps) : null],
    [L('ミサイル', 'Missiles'), s.mis ? L(`${fmt(s.mis)} 発`, `${fmt(s.mis)}`) + (s.misd ? L(`（計 ${fmt(s.misd)} ダメージ）`, ` (${fmt(s.misd)} damage total)`) : '') : null],
    [L('武器ハードポイント', 'Gun hardpoints'), s.guns ? s.guns.map(([sz, n]) => `S${sz}×${n}`).join(L('、', ', ')) : null],
    [L('ミサイルラック', 'Missile racks'), s.racks ? s.racks.map(([k, sz, n]) => `${tr(RACK, k)} S${sz}×${n}`).join(L('、', ', ')) : null],
    [L('砲塔', 'Turrets'), s.turrets ? s.turrets.map(([k, w, n]) => `${tr(TURRET, k)} (${w})×${n}`).join(L('、', ', ')) : null],
  ]));
  if(s.weapons) arm.push(`<table class="mini"><thead><tr><th>${L('標準の武器', 'Stock weapons')}</th><th class="r">${L('数', 'Qty')}</th></tr></thead><tbody>${s.weapons.map(([n, c]) => `<tr><td>${esc(n)}</td><td class="r num">${c}</td></tr>`).join('')}</tbody></table>`);
  if(s.dps || s.tdps || s.guns || s.turrets || s.weapons) sections.push([L('武装', 'Weapons'), arm.join('')]);
  if(s.parts) sections.push([L('標準装備', 'Stock components'), `<table class="mini"><thead><tr><th>${L('部品', 'Type')}</th><th>${L('名前', 'Name')}</th><th class="r">${L('サイズ', 'Size')}</th><th class="r">${L('グレード', 'Grade')}</th></tr></thead><tbody>${s.parts.map(([k, n, sz, g, c]) => `<tr><td>${esc(tr(PART, k))}${c > 1 ? ` ×${c}` : ''}</td><td>${esc(n)}</td><td class="r num">S${sz}</td><td class="r num">${GRADE(g)}</td></tr>`).join('')}</tbody></table>`]);
  if(s.buy) sections.push([L('購入できる場所', 'Where to buy'), shopTable(s.buy)]);
  if(s.rent) sections.push([L('レンタルできる場所（1日）', 'Where to rent (per day)'), shopTable(s.rent)]);

  const its = itemsOf(s.id);
  const mine = `<div class="mine">
    <div class="row"><b>${store.shared ? L('共有リスト', 'Shared list') : L('所持リスト', 'Owned list')}</b>
      <button class="btn small" type="button" data-add="own">${L('所持に追加', 'Mark as owned')}</button>
      <button class="btn ghost small" type="button" data-add="want">${L('欲しいに追加', 'Mark as wanted')}</button>
      <span class="hint">${store.shared ? L('共有リストの全員に見えます。', 'Everyone on the shared list can see this.') : L('このブラウザだけに保存されます。', 'Saved in this browser only.')}</span></div>
    ${its.length ? `<ul>${its.map(i => `<li><span class="pill ${i.kind}">${i.kind === 'own' ? L('所持', 'Owned') : L('欲しい', 'Wanted')}</span><span>${esc(i.by || me())}</span>
      <input type="text" id="memo-${esc(i.id)}" data-memo="${esc(i.id)}" maxlength="200" placeholder="${L('メモ（塗装・保険・置き場所など）', 'Note (paint, insurance, where it is stored…)')}" value="${esc(i.memo || '')}">
      <button class="btn ghost small" type="button" data-del="${esc(i.id)}">${L('外す', 'Remove')}</button></li>`).join('')}</ul>` : ''}
  </div>`;

  d.dataset.id = s.id;
  d.innerHTML = `<div class="dhead"><div><div class="mf">${esc(s.m)}${s.mc ? ` · ${esc(s.mc)}` : ''}</div><h2 id="dTitle">${esc(s.n)}</h2>${showVar(s) ? `<div class="muted">${esc(s.var)}</div>` : ''}</div>
      <button class="x" type="button" data-close aria-label="${L('閉じる', 'Close')}">×</button></div>
    <div class="dbody">
      <div class="hero">
        ${s.img ? `<img alt="${esc(s.n)}" src="${esc(imgSrc(s))}" onerror="this.remove()">` : ''}
        <div>
          <div class="tags">
            ${s.car ? `<span class="tag">${esc(tr(CAREER, s.car))}</span>` : ''}
            ${roleTokens(s).map(t => `<span class="tag" title="${esc(t)}">${esc(tr(ROLE, t))}</span>`).join('')}
            ${sz ? `<span class="tag">S${sz} ${sizeName(sz)}</span>` : ''}
            ${s.gv ? `<span class="tag">${L('地上車両', 'Ground vehicle')}</span>` : ''}
          </div>
          <div class="price">
            <span class="muted">${L('ゲーム内価格', 'In-game price')}</span><span class="v big">${priceOf(s) != null ? fmt(priceOf(s)) + ' aUEC' : `<span class="muted" style="font-size:13px">${L('ゲーム内では買えない', 'Not sold in game')}</span>`}</span>
            ${rentOf(s) != null ? `<span class="muted">${L('レンタル 1日', 'Rent per day')}</span><span class="v">${L(`${fmt(rentOf(s))} aUEC〜`, `from ${fmt(rentOf(s))} aUEC`)}</span>` : ''}
            ${s.msrp ? `<span class="muted">MSRP</span><span class="v">$${fmt(s.msrp)}${s.wb ? ` <span class="muted" style="font-size:12px">（Warbond $${fmt(s.wb)}）</span>` : ''}</span>` : ''}
            ${s.avail ? `<span class="muted">${L('公式ストア', 'Pledge store')}</span><span>${esc(tr(AVAIL, s.avail))}</span>` : ''}
          </div>
          <div class="links" style="margin-top:10px">
            ${s.wiki ? `<a href="${esc(s.wiki)}" target="_blank" rel="noopener">starcitizen.tools</a>` : ''}
            ${s.pledge ? `<a href="${esc(s.pledge)}" target="_blank" rel="noopener">${L('RSI 公式ストア', 'RSI pledge store')}</a>` : ''}
            <a href="https://uexcorp.space/vehicles" target="_blank" rel="noopener">UEX Corp</a>
          </div>
        </div>
      </div>
      ${mine}
      <div class="secs">${sections.map(([h, b]) => `<section class="sec"><h3>${h}</h3>${b}</section>`).join('')}</div>
      ${s.desc ? `<section class="sec"><h3>${L('説明（英語・ゲーム内テキスト）', 'Description (in-game text)')}</h3><p class="desc">${esc(s.desc)}</p></section>` : ''}
    </div>`;
  if(!d.open) d.showModal();
}
// 共有リストが他の人の操作で変わったとき、開いている詳細も描き直す（メモの入力中は除く）
function refreshDetail(){
  const d = $('detail');
  if(!d.open || !d.dataset.id || document.activeElement?.matches('[data-memo]')) return;
  openDetail(d.dataset.id);
}

/* ---------- 言語の切り替え ---------- */
function fillSelects(){
  const opts = (id, entries) => { const el = $(id), v = el.value; el.innerHTML = entries.map(([k, l]) => `<option value="${esc(k)}">${esc(l)}</option>`).join(''); el.value = v; };
  const count = f => { const c = {}; SHIPS.forEach(s => [].concat(f(s)).forEach(k => { if(k) c[k] = (c[k] || 0) + 1; })); return c; };
  const all = ['', L('すべて', 'All')];
  const mf = count(s => s.m);
  opts('mfr', [all, ...Object.keys(mf).sort().map(k => [k, `${k} (${mf[k]})`])]);
  const cr = count(s => s.car);
  opts('car', [all, ...Object.keys(cr).sort((a, b) => cr[b] - cr[a]).map(k => [k, `${tr(CAREER, k)} (${cr[k]})`])]);
  const rl = count(roleTokens);
  opts('role', [all, ...Object.keys(rl).sort((a, b) => tr(ROLE, a).localeCompare(tr(ROLE, b), LANG)).map(k => [k, LANG === 'ja' && ROLE[k] ? `${ROLE[k]}  ${k} (${rl[k]})` : `${k} (${rl[k]})`])]);
  opts('mark', [all, ['own', L('所持している船', 'Owned by anyone')], ['mine', L('自分の所持', 'Owned by me')], ['want', L('欲しい船', 'Wanted')], ['none', L('誰も持っていない船', 'Not owned')]]);
  const sizes = [...new Set(SHIPS.map(szOf).filter(Boolean))].sort();
  $('sizeSeg').innerHTML = `<button type="button" data-v="" aria-pressed="${st.size === ''}">${L('すべて', 'All')}</button>` + sizes.map(z => `<button type="button" data-v="${z}" aria-pressed="${st.size === String(z)}" title="${sizeName(z)}">S${z}</button>`).join('');
}
function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = L(...STR[el.dataset.i18n]); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = L(...STR[el.dataset.i18nPh]); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', L(...STR[el.dataset.i18nAria])); });
  $('langSeg').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === LANG));
  $('appVer').textContent = 'v' + APP_VERSION;
  $('updated').textContent = L(`アプリ更新 ${APP_UPDATED}`, `App updated ${APP_UPDATED} JST`);
  if(DATA.ships){
    $('gameVer').textContent = L('ゲーム版 ', 'Game version ') + (DATA.version || '?');
    $('fetched').textContent = L('データ取得 ', 'Data fetched ') + (DATA.fetched || '');
    fillSelects();
  }
  if(!flashing) $('storeNote').innerHTML = storeNoteHTML();
  if(typeof webLangChanged === 'function') webLangChanged();
  render();
  if($('detail').open) openDetail($('detail').dataset.id);
  if($('compare').open) openCompare();
}

/* ---------- 画面の操作 ---------- */
function bindUI(){
  $('langSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b || b.dataset.v === LANG) return;
    LANG = b.dataset.v; lsSet('scships-lang', LANG); applyLang();
  });
  const segs = (id, key) => $(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    st[key] = b.dataset.v;
    $(id).querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    render();
  });
  segs('typeSeg', 'type'); segs('sizeSeg', 'size');
  for(const k of ['q', 'mfr', 'car', 'role', 'cminMax', 'cmaxMin', 'scuMin', 'priceMax', 'mark']) $(k).addEventListener('input', () => { st[k] = $(k).value.trim(); render(); });
  for(const k of ['buyable', 'rentable']) $(k).addEventListener('change', () => { st[k] = $(k).checked; render(); });
  $('resetBtn').addEventListener('click', () => {
    Object.assign(st, DEFAULT);
    for(const k of ['q', 'mfr', 'car', 'role', 'cminMax', 'cmaxMin', 'scuMin', 'priceMax', 'mark']) $(k).value = '';
    $('buyable').checked = $('rentable').checked = false;
    for(const [id, key] of [['typeSeg', 'type'], ['sizeSeg', 'size']]) $(id).querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x.dataset.v === DEFAULT[key]));
    render();
  });
  $('sortAdd').addEventListener('change', () => {
    const k = $('sortAdd').value;
    if(k && sorts.length < SORT_MAX) sorts.push({k, dir: defaultDir(k)});
    render();
  });
  $('sortChips').addEventListener('click', e => {
    const d = e.target.closest('[data-sdir]'), r = e.target.closest('[data-srm]');
    if(d) sorts[+d.dataset.sdir].dir *= -1;
    if(r) sorts.splice(+r.dataset.srm, 1);
    if(d || r) render();
  });
  $('thead').addEventListener('click', e => {
    const th = e.target.closest('th[data-sort]'); if(th) headerSort(th.dataset.sort, e.shiftKey);
  });
  $('tbody').addEventListener('click', e => {
    const c = e.target.closest('input[data-cmp]');
    if(c){ toggleCmp(c.dataset.cmp, c.checked); return; }
    if(e.target.closest('td.cmp')) return;
    const tr = e.target.closest('tr[data-id]'); if(tr) openDetail(tr.dataset.id);
  });
  $('cmpChips').addEventListener('click', e => { const b = e.target.closest('[data-uncmp]'); if(b) toggleCmp(b.dataset.uncmp, false); });
  $('cmpClear').addEventListener('click', () => { cmp.length = 0; render(); });
  $('cmpOpen').addEventListener('click', openCompare);

  for(const d of [$('detail'), $('compare')]){
    d.addEventListener('click', e => {
      if(e.target === d || e.target.closest('[data-close]')){ d.close(); return; }
      const o = e.target.closest('[data-open]');
      if(o){ e.preventDefault(); $('compare').close(); openDetail(o.dataset.open); }
    });
  }
  const det = $('detail');
  const errText = err => err.message || err.code || err;
  det.addEventListener('click', async e => {
    const a = e.target.closest('[data-add]'), x = e.target.closest('[data-del]');
    try{
      if(a){ await store.add(det.dataset.id, a.dataset.add); openDetail(det.dataset.id); }
      if(x){ await store.remove(x.dataset.del); openDetail(det.dataset.id); }
    }catch(err){ flash(L('保存できませんでした: ', 'Could not save: ') + errText(err)); }
  });
  det.addEventListener('change', e => {
    const m = e.target.closest('[data-memo]');
    if(m) store.setMemo(m.dataset.memo, m.value.trim()).then(() => flash(L('メモを保存しました', 'Note saved')), err => flash(L('メモを保存できませんでした: ', 'Could not save the note: ') + errText(err)));
  });
}

async function boot(){
  applyLang();
  bindUI();
  try{
    DATA = await (await fetch('ships.json?v=1.2.0', {cache: 'no-cache'})).json();
  }catch(e){
    $('tbody').innerHTML = `<tr><td class="empty" colspan="${COLS.length}">${L('船のデータ（ships.json）を読み込めませんでした。ページを読み込み直してください。', 'Could not load the ship data (ships.json). Reload the page.')}</td></tr>`;
    return;
  }
  SHIPS = DATA.ships; SHIPS.forEach(s => BY_ID[s.id] = s);
  store.loadLocal();
  if(matchMedia('(max-width: 640px)').matches) $('more').open = false;
  applyLang();
  if(MODE === 'web' && typeof initWeb === 'function') initWeb();
}
boot();
</script>
